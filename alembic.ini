[alembic]
script_location = alembic
prepend_sys_path = .

# ERP's own lineage plus every composed module lineage. The `package:resource`
# form resolves through the installed distribution, so a module's revisions are
# read from the wheel ERP pinned rather than from a copy in this repository —
# there is exactly one authority for `mod_files`, and it is `dotmac-files`.
#
# `dotmac_kernel.migrations:versions` is deliberately ABSENT and must stay so.
# Kernel `0001_initial_tenant_schema` creates `public.tenants` unconditionally
# as its first table, and ERP hosts that table in its own lineage — listing the
# kernel lineage here would put a revision into ERP's revision map that can
# never be applied. `tests/integration/test_kernel_lineage_rehearsal.py` is the
# permanent negative canary for that fact.
version_locations = %(here)s/alembic/versions dotmac_files.migrations:versions dotmac_accounting.migrations:versions dotmac_imports.migrations:versions dotmac_numbering.migrations:versions dotmac_people.migrations:versions dotmac_tax.migrations:versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
