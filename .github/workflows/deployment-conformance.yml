name: Deployment conformance

# Calls the Starter-owned reusable gate at an immutable source revision. The
# published `dotmac-deployment-foundation==0.2.0a2` tag peels to 55750e10, and
# this workflow is pinned to that SAME revision on purpose. a2's only code
# change (`image/audit.py`) and that revision's workflow change are two halves
# of ONE fix: complete non-root image inspection. The package evaluates
# `Config.User` from inspect evidence; the workflow produces that evidence by
# running the filesystem collector as an inspection-only uid/gid 0 and refusing
# the gate on a partial walk. Pinning a2 against the earlier revision would pair
# a package expecting the new collector with a caller that does not supply it.
# A branch or tag is not admissible here.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deployment:
    uses: michaelayoade/dotmac_starter_mt/.github/workflows/deployment-conformance.yml@55750e104df3dd94b6f9f70bf8c8db53986394c7
    with:
      descriptor: deploy/product.toml
      rendered-dir: deploy/rendered
      thresholds: deploy/alerts/thresholds.json
      foundation-version: "0.2.0a2"
      # ARMED. Both digests are real: the assembly manifest digest, and the
      # image digest protected-main CI resolved for the image it built and
      # tested (`Publish Docker Image` -> "Resolve the registry digest of the
      # tested image"). This was left `false` for the sentinel period and
      # should have been flipped the moment the sentinel was replaced — an
      # all-zero digest PARSES, so with the gate off nothing at all prevented
      # a silent regression back to a placeholder. It is on now, and ERP's
      # production deploy path consumes exactly this digest, so turning it
      # back off would be turning off the check on the image production runs.
      require-real-digests: true
    secrets:
      FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
