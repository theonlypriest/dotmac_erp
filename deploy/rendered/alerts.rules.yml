          runbook: "#synthetic-health-fail"
          recovery: "3 consecutive successes"
          protects: "end-to-end reachability"
          dedup_by: "product"
  - name: "dotmac_product_dotmac-erp"
    rules:
      - alert: "GL_UNPOSTED_BATCH_STALLED"
        expr: "increase(job_runs_total{task=\"post_approved_journal_backlog\",status=\"success\"}[30m]) == 0"
        for: "1800s"
        labels:
          severity: "ticket"
          owner: "finance-platform-oncall"
          product: "dotmac-erp"
        annotations:
          summary: "No successful GL journal-backlog posting run in 30 minutes; approved journal entries are not reaching POSTED."
          runbook: "No dedicated runbook exists yet. First checks: `worker` container logs for post_approved_journal_backlog exceptions; Celery queue depth; whether the DB or Redis dependency checks are degraded."
          recovery: "increase(job_runs_total{task=\"post_approved_journal_backlog\",status=\"success\"}[30m]) > 0"
          protects: "Period close and trial-balance accuracy depend on approved journals reaching POSTED without unbounded delay."
          dedup_by: "product,environment,alert"
      - alert: "AP_PAYMENT_POSTING_STALLED"
        expr: "increase(job_runs_total{task=\"post_unposted_ap_invoices\",status=\"success\"}[30m]) == 0"
        for: "1800s"
        labels:
          severity: "page"
          owner: "finance-platform-oncall"
          product: "dotmac-erp"
        annotations:
          summary: "No successful AP invoice-posting run in 30 minutes; approved supplier invoices/payments are not moving forward."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for post_unposted_ap_invoices exceptions; upstream bank/Paystack integration health via /health/monitoring."
          recovery: "increase(job_runs_total{task=\"post_unposted_ap_invoices\",status=\"success\"}[30m]) > 0"
          protects: "Vendor payment obligations and supplier trust depend on AP postings not silently stalling."
          dedup_by: "product,environment,alert"
      - alert: "PAYROLL_DRAFT_GENERATION_FAILED"
        expr: "increase(job_runs_total{task=\"auto_generate_draft_payroll\",status=\"failure\"}[1h]) > 0"
        for: "3600s"
        labels:
          severity: "page"
          owner: "people-platform-oncall"
          product: "dotmac-erp"
        annotations:
          summary: "auto_generate_draft_payroll has failed at least once in the last hour; a payroll run may not have been created on schedule."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for auto_generate_draft_payroll traceback; whether a draft PayrollEntry (PayrollEntryStatus.DRAFT) exists for the expected period."
          recovery: "increase(job_runs_total{task=\"auto_generate_draft_payroll\",status=\"failure\"}[1h]) == 0"
          protects: "Payroll runs on a fixed statutory/pay-period calendar; a missed or failed draft generation directly threatens on-time pay."
          dedup_by: "product,environment,alert"
      - alert: "IMPORT_BACKLOG_STALLED"
        expr: "increase(job_runs_total{task=\"process_customer_import_partitions\",status=\"failure\"}[1h]) > 3"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "data-platform-oncall"
          product: "dotmac-erp"
        annotations:
          summary: "More than 3 failed customer-import partition runs in the last hour; the bulk-import backlog is not draining cleanly."
          runbook: "No dedicated runbook exists yet. First checks: worker logs for process_customer_import_partitions exceptions; the relevant ImportRun's per-row outcome ledger (dotmac-imports)."
          recovery: "increase(job_runs_total{task=\"process_customer_import_partitions\",status=\"failure\"}[1h]) <= 3"
          protects: "Customer bulk-import correctness and the promotion gate that depends on a clean dry-run/apply partition run."
          dedup_by: "product,environment,alert"
      - alert: "GL_POSTING_LATENCY_HIGH"
        expr: "histogram_quantile(0.95, sum(rate(job_duration_seconds_bucket{task=\"post_approved_journal_backlog\"}[10m])) by (le)) > 60"
        for: "600s"
        labels:
          severity: "info"
          owner: "finance-platform-oncall"
          product: "dotmac-erp"
        annotations:
          summary: "p95 GL journal-backlog posting duration exceeds 60s; posting is slow rather than failed outright."
          runbook: "No dedicated runbook exists yet. First checks: DB lock contention on journal_entry/journal_entry_line tables; organization_id cardinality in the current backlog."
          recovery: "histogram_quantile(0.95, sum(rate(job_duration_seconds_bucket{task=\"post_approved_journal_backlog\"}[10m])) by (le)) <= 60"
          protects: "Early warning before GL_UNPOSTED_BATCH_STALLED fires outright; slow posting degrades close-process confidence before it fully stalls."
          dedup_by: "product,environment,alert"
