upstream dotmac-erp_app {
    server 127.0.0.1:8002 max_fails=1 fail_timeout=1s;
    # Warm deployment candidate. Its PRESENCE is the handoff mechanism — nginx
    # promotes it itself the moment the primary stops answering; nothing
    # rewrites this file or reloads nginx to do that. The deployment engine
    # only VERIFIES this line is present (see handoff_contract_pattern).
    server 127.0.0.1:18001 backup max_fails=1 fail_timeout=1s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.dotmac.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.dotmac.io;

    ssl_certificate /etc/letsencrypt/live/erp.dotmac.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.dotmac.io/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A real proxy sits in front of nginx: resolve the true
    # client address from a TRUSTED CIDR's X-Forwarded-For
    # instead of originating fresh headers below, which would
    # just discard whatever the proxy already resolved.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    # X-XSS-Protection is deliberately NOT emitted: the header is
    # deprecated, current browsers ignore it, and older ones had
    # exploitable bugs in the filter it turned on. CSP above is the
    # replacement (inventory defect D12 — the canonical source ships
    # every other security header and omits this one).

    access_log /var/log/nginx/dotmac-erp.access.log;
    error_log /var/log/nginx/dotmac-erp.error.log;

    # Retry the candidate only when the primary cannot accept the
    # request. `non_idempotent` is deliberately absent: replaying a
    # POST onto the candidate after the primary half-processed it
    # would duplicate the write, not just the read.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Static assets are baked into the image and promoted with
    # its digest; nginx PROXIES rather than aliasing a host
    # path, so a rollback restores them automatically
    # (inventory defect D1 — a bind-mounted static/ directory
    # left production serving a different tree than its image).
    location /static/ {
        proxy_pass http://dotmac-erp_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        proxy_pass http://dotmac-erp_app;
        proxy_set_header Host $host;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://dotmac-erp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        client_max_body_size 10485760;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
