[tool.poetry]
name = "dotmac_erp"
version = "1.33.4"
description = "IFRS-based multi-tenant accounting software"
authors = ["DotMac <dev@dotmac.ng>"]
package-mode = false
requires-poetry = "2.4.1"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.111.0"
uvicorn = {version = "0.30.1", extras = ["standard"]}
sqlalchemy = "2.0.31"
psycopg = {version = "3.1.19", extras = ["binary"]}
alembic = "1.13.2"
pydantic = "2.7.4"
python-dotenv = "1.0.1"
jinja2 = ">=3.1.6"
redis = "5.0.4"
celery = {version = "5.4.0", extras = ["redis"]}
prometheus-client = "0.20.0"
httpx = "0.27.0"
dotmac-integration-client = { git = "https://github.com/michaelayoade/dotmac-integration-client.git", tag = "v0.2.0" }
opentelemetry-api = "1.26.0"
opentelemetry-sdk = "1.26.0"
opentelemetry-exporter-otlp = "1.26.0"
opentelemetry-instrumentation-fastapi = "0.47b0"
opentelemetry-instrumentation-sqlalchemy = "0.47b0"
opentelemetry-instrumentation-celery = "0.47b0"
python-logging-loki = "0.3.1"
sentry-sdk = {version = "^2.0", extras = ["fastapi"]}
python-jose = {version = "3.3.0", extras = ["cryptography"]}
passlib = {version = "1.7.4", extras = ["bcrypt"]}
pyotp = "2.9.0"
cryptography = ">=44.0.1"
gunicorn = "^23.0.0"
weasyprint = "^62.0"
# WeasyPrint 62 calls pydyf.Stream.transform, which was removed in pydyf 0.12.
# Keep the compatibility decision in the lock instead of mutating the runtime
# environment with a second, untracked pip install.
pydyf = "0.11.0"
python-dateutil = "^2.9.0"
shapely = "^2.0.0"
msoffcrypto-tool = "^6.0.0"
openpyxl = "^3.1.5"
xlrd = "^2.0.1"
minio = "^7.2.0"
click = "^8.1.0"
google-auth = "^2.53.0"
pymysql = "^1.1.1"
# Kernel adoption slice E2 (docs/PLATFORM_ADOPTION_LEDGER.md): EXACT pin, no
# range — the dependency-update gate in
# tests/architecture/test_kernel_compatibility.py rejects any ^/~/>=/* drift.
# Runtime app/ imports remain bounded by
# tests/architecture/test_kernel_import_boundary.py. The ERP lineage also uses
# the published prerequisite vocabulary/verifier to host
# idempotency_ledger.v1 without composing the kernel lineage. No extras:
# [testing]'s only pull (httpx) and [licensing]'s (cryptography) are already ERP
# main dependencies at compatible versions.
dotmac-kernel = {version = "0.1.0a98", source = "forgejo"}

# Shared presentation contract: compiled assets and inert Jinja package data.
# ERP supplies the host loader and never vendors or recompiles this package.
dotmac-ui = {version = "0.1.0a7", source = "forgejo"}

# Stored bytes and their repairable physical lifecycle — NOT what those bytes
# mean to a customer, invoice or ticket (ADR-0022). ERP's first foreign
# migration lineage: `mod_files` is owned by this distribution, and ERP composes
# it through `alembic.ini`'s `version_locations` rather than copying it.
#
# It installs here at all only because a module declares the database EFFECTS it
# needs instead of naming a foreign revision. `fi_0001` requires
# `tenant_scope_catalog.v1` and `module_database_roles.v1`; ERP binds both to
# revisions it actually runs (`app/migration_bindings.py`), because kernel
# `0001` can never run in ERP — it creates `public.tenants`, which ERP owns.
dotmac-files = {version = "0.1.0a2", source = "forgejo"}

# Durable import run, partition, claim and per-row outcome ownership. ERP keeps
# customer vocabulary, validation and mutation in its own adapter; the module
# owns only reusable mechanics and its independently composed `mod_imports`
# lineage. The pin is released only after this first adopter proves the a2
# contract against PostgreSQL.
dotmac-imports = {version = "0.1.0a2", source = "forgejo"}

# Balanced general-ledger decisions and immutable posted-ledger evidence
# (Starter ADR-0041). ERP is the product-first source and remains the LIVE
# authority: this pin COMPOSES the `mod_accounting` lineage so it can be applied
# and proven, and does nothing else. `ACCOUNTING_COMPOSITION_ENABLED` stays
# false, no ERP writer is repointed, and no authority has moved — see
# `docs/architecture/accounting-adoption-boundary.md` gate C.
#
# `ac_0001_accounting` is a second foreign lineage beside `dotmac-files`. Both
# are independent roots carrying their own branch label, so ERP's revision graph
# has MULTIPLE heads by design and `alembic upgrade heads` (plural) is the
# deploy path. Acceptance is "exactly the expected branch heads and no
# unintended ones", never "one global head".
#
# The kernel repin above (a83 -> a85) is DEMANDED by this pin, not bundled with
# it: `dotmac-accounting 0.1.0a1` floors at `dotmac-kernel >= 0.1.0a85`, so the
# lock cannot resolve at a83. `dotmac-files` needs no repin and stays at a2.
dotmac-accounting = {version = "0.1.0a1", source = "forgejo"}

# Concurrency-safe document-series allocation and immutable allocation evidence.
# This composition-only slice installs the tenant plane of `mod_numbering`; it
# does not import the runtime service, seed a series, repoint BANK_STATEMENT or
# move authority from ERP's legacy allocators. The explicit plane decision is
# `app/migration_planes.py` and the later cutover remains one series family at a
# time with a caller-supplied business date.
dotmac-numbering = {version = "0.1.0a2", source = "forgejo"}

# Tenant employment-directory storage plus the reviewed, operator-only
# Employment Type bootstrap API. No web/API/job caller imports the module, no
# legacy People writer is repointed, and runtime authority remains in ERP.
dotmac-people = {version = "0.1.0a2", source = "forgejo"}

# Generic tax policy, determination and statutory evidence. C2 composes the
# released `tx` lineage and public read contract only. ERP's legacy calculator
# and filing writers remain authoritative while `TAX_COMPOSITION_ENABLED` is
# false; policy backfill, shadow comparison and cohort cutover are later gates.
dotmac-tax = {version = "0.1.0a3", source = "forgejo"}

# Private Forgejo PyPI index (Dotmac packages). Explicit priority: only
# dependencies that name this source resolve from it; PyPI stays the default.
# Credentials are NEVER stored in this repository — poetry reads them from its
# own auth store under the source name "forgejo".
[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
# Stateless build/deploy facility. Exact private-index pin: its rendered bytes
# and CLI exit codes are a public contract, so a range could change deployment
# behaviour without an ERP diff. Dev-only: it never ships in the runtime image.
dotmac-deployment-foundation = {version = "0.2.0a2", source = "forgejo"}
pytest = "8.2.2"
pytest-cov = "5.0.0"
pytest-asyncio = "^1.3.0"
pytest-playwright = "^0.7.2"
mypy = "^1.19.1"
types-python-dateutil = "^2.9.0.20251115"
pandas = "^2.3.3"
# Exact, not a caret range. A caret lets any 0.x >= 0.15 satisfy the
# declaration, so a fresh `poetry lock` can float the formatter underneath a
# repo whose committed formatting is a fixed point of ONE ruff version. The
# lock, .pre-commit-config.yaml's `rev`, and this line must name the same
# version — tests/architecture/test_toolchain_coherence.py fails when they
# drift apart.
ruff = "0.15.0"
pre-commit = "^4.5.1"
detect-secrets = "^1.5.0"
bandit = "^1.9.3"
xlwt = "^1.3.0"
pytest-timeout = "^2.4.0"
nuitka = "^2.1"
vulture = "^2.16"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import order in legacy modules; gradual cleanup
    "E712",   # comparison to True/False — intentional in SQLAlchemy filters (column == True)
    "E711",   # None comparison — SQLAlchemy uses `== None` for IS NULL filters
    "E741",   # ambiguous variable name — common in financial code (l, I)
    "B008",   # function calls in defaults — FastAPI Depends() pattern
    "B904",   # raise from — gradual adoption, too many existing violations
    "S101",   # assert used — OK in tests
    "S104",   # binding to all interfaces — OK for Docker
    "S110",   # try-except-pass — some are intentional (optional cleanup)
    "UP007",  # X | Y unions — keep Optional[] for readability
    "UP017",  # datetime.UTC alias migration deferred for py311 compatibility pattern
    "UP042",  # StrEnum — large refactor, existing str+Enum pattern works
    "SIM102", # collapsible if — readability preference, not a bug
    "SIM105", # suppressible exception — contextlib.suppress() not always clearer
    "SIM108", # ternary — multiline if/else often more readable
    "I001",   # import sorting churn deferred; avoid mass unrelated rewrites
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311", "B017", "SIM117"]  # test fixtures use hardcoded values
"alembic/**/*.py" = ["E402", "F841", "S608"]  # migrations: late imports, unused vars, raw SQL
"scripts/**/*.py" = ["T20", "E402", "S", "SIM103", "F841", "B905", "F601", "B007"]  # scripts: one-off maintenance scripts
"app/tools/**/*.py" = ["T20", "S"]  # one-off tools
"tools/**/*.py" = ["T20", "S"]  # internal CLI tools (license gen, etc.)
".claude/hooks/**/*.py" = ["T20", "F841"]  # local workflow hooks
"app/tasks/data_health.py" = ["S608"]  # data health tasks: conditional SQL with hardcoded fragments

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
warn_redundant_casts = false
disallow_untyped_defs = false  # gradual adoption
check_untyped_defs = true
exclude = [
    "app/starter/",   # WIP subscription billing module — gradual type adoption
    "app/tools/",     # one-off scripts, not production code
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tasks/*",
    "app/celery_app.py",
    "app/config.py",
    "alembic/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "raise NotImplementedError",
]
show_missing = true

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "alembic", "scripts"]

[tool.vulture]
min_confidence = 80
ignore_names = [
    "exc_type", "exc_val", "exc_tb",          # __exit__ protocol
    "flush_context",                           # SQLAlchemy event API
    "is_approved", "triggered_by_user_id",     # FastAPI query params
    "attendance_percentage",                   # FastAPI query params
    "cleared_date", "accepted_by",             # Public API params (callers use kwargs)
    "goodwill_account_id",
    "reopened_by_user_id", "termination_reason",
    "acknowledged_by_id",
    "include_attendance", "prorate_joiners", "prorate_exits",
    "lookback_days", "include_credit_notes",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
